<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrotaGestor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚚</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-blue-950 min-h-screen text-black p-4">
<div class="container mx-auto max-w-3xl">
    <!-- Header Compacto -->
    <div class="text-center mb-10">
        <h1 class="text-4xl md:text-5xl font-black text-white mb-6 drop-shadow-xl">🚚 FrotaGestor</h1>
        <div class="bg-white/95 backdrop-blur-xl p-5 rounded-2xl shadow-xl border max-w-2xl mx-auto">
            <div class="flex flex-col sm:flex-row items-center justify-center gap-6">
                <div class="flex items-center gap-2 p-3 bg-gray-50 rounded-xl border shadow-sm">
                    <span id="status-dot" class="w-5 h-5 bg-yellow-500 rounded-full animate-pulse"></span>
                    <span id="status-text" class="font-bold text-gray-800">Verificando...</span>
                </div>
                <span id="timestamp" class="text-lg font-bold text-gray-700"></span>
            </div>
        </div>
    </div>

    <!-- Cards Compactos -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <!-- Servidor -->
        <div class="bg-blue-800/60 backdrop-blur-xl rounded-2xl p-6 border-2 border-blue-700/80 shadow-xl hover:border-blue-500 hover:shadow-blue-500/30 hover:-translate-y-1 transition-all">
            <div class="flex items-center mb-4">
                <div class="w-10 h-10 bg-green-500/95 backdrop-blur rounded-xl flex items-center justify-center mr-3 shadow-lg border border-green-400/60">
                    <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/></svg>
                </div>
                <div><h3 class="text-xl font-bold text-white drop-shadow">Servidor</h3></div>
            </div>
            <div class="text-center space-y-2">
                <p id="uptime" class="text-2xl font-black text-green-400 drop-shadow">-</p>
                <p id="version" class="text-sm font-bold bg-white/95 px-3 py-1 rounded-lg shadow inline-block">-</p>
                <p id="cpu-mem" class="text-xs font-medium text-white/90">-</p>
            </div>
        </div>

        <!-- Banco -->
        <div class="bg-blue-800/60 backdrop-blur-xl rounded-2xl p-6 border-2 border-blue-700/80 shadow-xl hover:border-blue-500 hover:shadow-blue-500/30 hover:-translate-y-1 transition-all">
            <h3 class="text-xl font-bold text-white drop-shadow mb-4 text-center">🗄️ Banco</h3>
            <div class="text-center">
                <p id="db-status" class="text-3xl font-black text-red-500 drop-shadow mb-2">🔴 Offline</p>
                <p id="db-details" class="text-xs font-medium bg-white/95 px-4 py-2 rounded-lg shadow inline-block">-</p>
            </div>
        </div>

        <!-- Backup -->
        <div class="bg-blue-800/60 backdrop-blur-xl rounded-2xl p-6 border-2 border-blue-700/80 shadow-xl hover:border-blue-500 hover:shadow-blue-500/30 hover:-translate-y-1 transition-all">
            <h3 class="text-xl font-bold text-white drop-shadow mb-4 text-center">💾 Backup</h3>
            <div class="text-center">
                <p id="backup-status" class="text-3xl font-black text-red-500 drop-shadow mb-2">❌</p>
                <p id="backup-details" class="text-xs font-medium bg-white/95 px-4 py-2 rounded-lg shadow inline-block">-</p>
            </div>
        </div>
    </div>

    <!-- Suporte Compacto -->
    <div class="bg-blue-900/80 backdrop-blur-xl rounded-2xl p-6 border-2 border-blue-600/70 shadow-2xl mb-8">
        <h3 class="text-2xl font-bold text-center mb-6 text-white drop-shadow">👨‍💻 Suporte</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
            <div class="p-4 bg-blue-700/70 rounded-xl border border-blue-500/60"><p class="text-xl font-bold text-white">🏢 BlueTech</p><p class="text-xs text-blue-100">Informática</p></div>
            <div class="p-4 bg-blue-700/70 rounded-xl border border-blue-500/60"><p class="text-xl font-bold text-white">🧑 Elielton</p><p class="text-xs text-blue-100">16/01/2026</p></div>
            <div class="p-4 bg-blue-700/70 rounded-xl border border-blue-500/60"><p class="text-lg font-bold text-white">(38) 98866-3580</p><p class="text-xs text-blue-100">elielton14@gmail.com</p></div>
        </div>
    </div>

    <div class="text-center opacity-90 text-xs font-medium text-white/80 drop-shadow-sm">
        <p>Ktor • BlueTech - Espinosa © 2026</p>
        <p>Sync: <span id="last-sync">-</span></p>
    </div>
</div>

<script>
    const EL = (id) => document.getElementById(id);

    function updateTime() {
        EL('timestamp').textContent = new Date().toLocaleString('pt-BR');
    }

    async function loadVersion() {
        try {
            const res = await fetch('/status', { cache: 'no-cache' });
            if (res.ok) {
                const data = await res.json();

                // Status geral
                EL('status-dot').style.background = '#22c55e';
                EL('status-text').textContent = '🟢 Online';

                // Servidor
                EL('uptime').textContent = data.uptime || '-';
                EL('version').textContent = `v${data.version || '-'}`;
                EL('cpu-mem').textContent = `${data.cpu || '-'} • ${data.memoryUsed}/${data.memoryTotal}`;

                // Banco de dados
                EL('db-status').textContent = data.dbStatus || '🔴 Offline';
                EL('db-status').className = `text-3xl font-black ${data.dbStatus?.includes('🟢') ? 'text-green-500' : 'text-red-500'} mb-2 drop-shadow`;
                EL('db-details').textContent = data.dbDetails || '-';

                // Backup
                EL('backup-status').textContent = data.backupStatus || '❌';
                EL('backup-status').className = `text-3xl font-black ${data.backupStatus?.includes('🟢') ? 'text-green-500' : 'text-red-500'} mb-2 drop-shadow`;
                EL('backup-details').textContent = data.backupLast ? `${data.backupLast} (${data.backupCount || 0} backups)` : 'Nenhum backup';

            } else throw new Error('Erro ao carregar status');
        } catch (error) {
            console.error('Erro:', error);
            EL('status-dot').style.background = '#ef4444';
            EL('status-text').textContent = '🔴 Offline';
        }
        EL('last-sync').textContent = new Date().toLocaleTimeString('pt-BR');
    }

    updateTime();
    loadVersion();
    setInterval(() => {
        updateTime();
        loadVersion();
    }, 10000);
</script>
</body>
</html>
