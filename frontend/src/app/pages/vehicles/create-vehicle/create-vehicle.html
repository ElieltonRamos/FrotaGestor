<!-- create-vehicle.html -->
<div
  class="max-w-5xl mx-auto mt-8 p-6 bg-white shadow rounded-lg border border-gray-200 grid grid-cols-1 lg:grid-cols-3 gap-8"
>
  <!-- Coluna principal -->
  <div class="lg:col-span-2 flex flex-col justify-between">
    <h2 class="text-2xl font-semibold mb-6">Cadastro de Veículo</h2>

    <!-- Seleção de Subfrota (OPCIONAL) -->
    <div class="mb-6">
      <label class="block text-xs font-semibold text-gray-600 mb-1">
        Subfrota
      </label>
      <div class="flex gap-2">
        <input
          type="text"
          class="border border-gray-300 rounded-lg px-3 py-1.5 w-full text-sm bg-gray-100"
          [value]="selectedSubfleet ? selectedSubfleet.name : ''"
          readonly
        />
        <button
          type="button"
          class="px-3 py-1.5 rounded bg-blue-600 text-white text-xs hover:bg-blue-700 flex items-center gap-1"
          (click)="showSubfleetModal = true"
        >
          <i class="fas fa-search"></i>
          Selecionar
        </button>
      </div>
    </div>

    <!-- Motorista -->
      <div class="mb-2">
        <label class="block text-xs font-semibold text-gray-600 mb-1">
          Motorista Padrão
        </label>
        <div class="flex gap-2">
          <input
            type="text"
            class="border border-gray-300 rounded-lg px-3 py-1.5 w-full text-sm bg-gray-100"
            [value]="selectedDriver ? selectedDriver.name : ''"
            readonly
          />
          <button
            type="button"
            class="px-3 py-1.5 rounded bg-blue-600 text-white text-xs hover:bg-blue-700"
            (click)="showDriverModal = true"
          >
            Selecionar
          </button>
        </div>
      </div>

    <!-- Form principal -->
    <app-dynamic-form
      [fields]="vehicleFields"
      (formSubmit)="saveVehicle($event)"
    >
    </app-dynamic-form>

    <!-- Modal Subfrota -->
    <app-select-modal
      [show]="showSubfleetModal"
      title="Selecionar Subfrota"
      [columns]="subfleetColumns"
      [filtersConfig]="subfleetFilters"
      [dataFetcher]="subfleetFetcher"
      (select)="onSubfleetSelect($event)"
      (close)="showSubfleetModal = false"
    ></app-select-modal>
  </div>

  <!-- Imagem lateral -->
  <div class="hidden lg:flex items-center justify-center">
    <img
      src="register-vehicle.svg"
      alt="Ilustração de veículo"
      class="max-h-64 opacity-90"
      style="filter: drop-shadow(4px 4px 8px rgba(0, 0, 0, 0.25))"
    />
  </div>
</div>

<app-select-modal
  [show]="showDriverModal"
  title="Selecionar Motorista Padrão"
  [columns]="driverColumns"
  [filtersConfig]="driverFilters"
  [dataFetcher]="driverFetcher"
  (select)="onDriverSelect($event)"
  (close)="showDriverModal = false"
></app-select-modal>
